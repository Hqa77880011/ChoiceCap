[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choicecap"
version = "0.1.0"
description = "Conflict frontier enforcement of non-composable delegation alternatives implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "psutil>=5.9"]

[project.scripts]
choicecap = "choicecap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

